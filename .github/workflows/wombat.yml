name: Wombat

on:
  push:
    paths:
      - 'wombat/**'
      - '.github/workflows/wombat.yml'
  pull_request:
    paths:
      - 'wombat/**'
      - '.github/workflows/wombat.yml'

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wombat
    steps:
    - uses: actions/checkout@v7
    - name: Show toolchain
      run: rustc --version && cargo --version
    - name: Format
      run: cargo fmt --all -- --check
    - name: Lint
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo test --workspace
    - name: Build for the web and for phones
      run: |
        for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios; do
          cargo check --target "$target" -p wombat-core -p wombat-search
        done

  app:
    name: Bridge and bare app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wombat/app
    env:
      # The version the app was made with; raise it together with `app/pubspec.lock`.
      FLUTTER_VERSION: 3.47.9
      FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
    steps:
    - uses: actions/checkout@v7
    - name: Install Flutter
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsS -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        echo "${FLUTTER_SHA256}  flutter.tar.xz" | sha256sum -c -
        tar -xJf flutter.tar.xz
        rm flutter.tar.xz
        echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
    - name: Show toolchain
      run: flutter --version && rustc --version
    - name: Get packages
      run: flutter pub get
    - name: Format
      run: dart format --output=none --set-exit-if-changed lib/*.dart lib/grid test integration_test test_driver
    - name: Analyze
      run: flutter analyze
    - name: Build the bridge
      working-directory: wombat
      run: cargo build -p wombat_bridge
    # Without a device: the Dart side calls the real core through the library just built.
    - name: Test
      run: flutter test
