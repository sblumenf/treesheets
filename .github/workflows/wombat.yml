name: Wombat

on:
  push:
    paths:
      - 'wombat/**'
      - '.github/workflows/wombat.yml'
  pull_request:
    paths:
      - 'wombat/**'
      - '.github/workflows/wombat.yml'

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run before it pointless.
concurrency:
  group: wombat-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the app was made with; raise it together with `app/pubspec.lock`.
  FLUTTER_VERSION: 3.47.9
  FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
  # Nothing is built twice in one run and a backtrace needs line numbers only, which leaves
  # the cached `target` at a third of the size.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # What Flutter of the version above asks for (`flutter.ndkVersion`).
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wombat
    steps:
    - uses: actions/checkout@v7
    # No restore-keys: what another lock file or compiler built would only be carried along.
    - name: Cache the crates and what was built of them
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          wombat/target
        key: wombat-check-${{ runner.os }}-${{ hashFiles('wombat/Cargo.lock', 'wombat/rust-toolchain.toml') }}
    # The first call installs what `rust-toolchain.toml` pins.
    - name: Show toolchain
      run: rustc --version && cargo --version
    - name: Format
      run: cargo fmt --all -- --check
    - name: Lint
      run: cargo clippy --locked --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo test --locked --workspace
    - name: Build for the web and for phones
      run: |
        for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios; do
          cargo check --locked --target "$target" -p wombat-core -p wombat-search
        done

  app:
    name: Bridge and app on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wombat/app
    env:
      # The generator of the same version as the `flutter_rust_bridge` crate and package.
      CODEGEN_VERSION: 2.13.0
      CODEGEN_SHA256: 1bb088e6ea42782848ea6507ab745371dbde58c83abef137d3e1e68ce510d45b
      # The generator calls it. It has no prebuilt release, so it is built once and cached.
      CARGO_EXPAND_VERSION: 1.0.127
    steps:
    - uses: actions/checkout@v7
    # What `flutter build linux` needs, and a display for the app to run on.
    - name: Install the Linux build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
    - name: Cache the crates and what was built of them
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          wombat/target
        key: wombat-app-${{ runner.os }}-${{ hashFiles('wombat/Cargo.lock', 'wombat/rust-toolchain.toml') }}
    - name: Cache cargo-expand
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/cargo-expand
        key: cargo-expand-${{ runner.os }}-${{ env.CARGO_EXPAND_VERSION }}
    - name: Cache the Dart packages
      uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        key: wombat-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('wombat/app/pubspec.lock', 'wombat/app/rust_builder/cargokit/build_tool/pubspec.lock') }}
    - name: Install Flutter
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSL --retry 3 -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        echo "${FLUTTER_SHA256}  flutter.tar.xz" | sha256sum -c -
        tar -xJf flutter.tar.xz
        rm flutter.tar.xz
        echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
    - name: Show toolchain
      run: flutter --version && rustc --version
    - name: Get packages
      run: flutter pub get --enforce-lockfile
    - name: Install the bridge generator
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSL --retry 3 -o codegen.tgz "https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v${CODEGEN_VERSION}/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v${CODEGEN_VERSION}.tgz"
        echo "${CODEGEN_SHA256}  codegen.tgz" | sha256sum -c -
        mkdir codegen
        tar -xzf codegen.tgz -C codegen
        rm codegen.tgz
        echo "$PWD/codegen" >> "$GITHUB_PATH"
    # The generator would install the newest one by itself; this one is the version named above.
    - name: Install cargo-expand
      run: |
        if ! cargo expand --version | grep -qxF "cargo-expand $CARGO_EXPAND_VERSION"; then
          cargo install --locked --force cargo-expand --version "$CARGO_EXPAND_VERSION"
        fi
    - name: Check that the generated code is what the generator writes
      run: |
        # Everything generated is removed first, so that a file the generator writes no
        # more is seen as deleted: left in place it would be neither changed nor new.
        rm -rf lib/src/rust ../crates/wombat-bridge/src/frb_generated.rs
        flutter_rust_bridge_codegen generate
        (cd .. && cargo fmt --all)
        cd "$GITHUB_WORKSPACE"
        generated=(wombat/crates/wombat-bridge/src/frb_generated.rs wombat/app/lib/src/rust)
        # `git status` and not `git diff`, which says nothing of a file that is new.
        if [ -n "$(git status --porcelain -- "${generated[@]}")" ]; then
          git status --short -- "${generated[@]}"
          # `head` closing the pipe early must not end the step before the message.
          git diff -- "${generated[@]}" | head -n 200 || true
          echo "::error::The generated bridge code is not what flutter_rust_bridge_codegen ${CODEGEN_VERSION} writes from crates/wombat-bridge/src/api/. In wombat/app run 'flutter_rust_bridge_codegen generate', then in wombat 'cargo fmt --all', and commit the result (wombat/AGENTS.md)."
          exit 1
        fi
    - name: Format
      run: dart format --output=none --set-exit-if-changed lib/*.dart lib/grid test integration_test test_driver
    - name: Analyze
      run: flutter analyze
    - name: Build the bridge
      working-directory: wombat
      run: cargo build --locked -p wombat_bridge
    # Without a device: the Dart side calls the real core through the library just built.
    - name: Test without a device
      run: flutter test
    # The real app, built for Linux and its buttons pressed. One file at a time: with the
    # whole folder in one call the second app does not start.
    - name: Test the app on Linux
      run: |
        for test in integration_test/*_test.dart; do
          echo "::group::$test"
          xvfb-run -a flutter test "$test" -d linux
          echo "::endgroup::"
        done

  # A job of its own, so that it is plain which of the two failed. Nothing runs here: it
  # shows that the bridge and the app still build for a phone (arm64). The job after it
  # runs the app, on an emulator, which is not arm64.
  android:
    name: App for Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wombat/app
    steps:
    - uses: actions/checkout@v7
    - name: Cache the crates
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: wombat-android-${{ runner.os }}-${{ hashFiles('wombat/Cargo.lock') }}
    - name: Cache the Dart packages
      uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        key: wombat-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('wombat/app/pubspec.lock', 'wombat/app/rust_builder/cargokit/build_tool/pubspec.lock') }}
    - name: Install Flutter
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSL --retry 3 -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        echo "${FLUTTER_SHA256}  flutter.tar.xz" | sha256sum -c -
        tar -xJf flutter.tar.xz
        rm flutter.tar.xz
        echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
    # The runner has the Android SDK with its licences accepted. No answer is given to a
    # question, so that one asked fails here and does not wait.
    - name: Install the NDK
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" < /dev/null
    # The build compiles the bridge with rustup's `stable`, not the pinned version (A131).
    - name: Show toolchain
      run: |
        flutter doctor -v
        rustup toolchain list
        df -h .
    - name: Get packages
      run: flutter pub get --enforce-lockfile
    - name: Build
      run: flutter build apk --debug --target-platform android-arm64

  # The app on an Android emulator: each file of `integration_test/`, one call per file as
  # on Linux. A job of its own, so that a device that does not start is told apart from an
  # app that does not build. The emulator is x86-64, as the runner is, so that it runs on
  # the runner's processor (KVM) and does not imitate another one.
  #
  # What this shows is that the bridge's library loads on Android, that the app keeps its
  # document in its own storage there and draws at the size of a phone. The tests press,
  # type, go back and leave the app inside Flutter, not through Android: the on-screen
  # keyboard, the back button and what Android does to an app out of sight stay untried.
  emulator:
    name: App on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: wombat/app
    env:
      # Android 14 without Google's services: nothing here uses them, and they are what
      # keeps an emulator busy after it starts. Not the smaller image made for tests
      # (`aosp_atd`), which leaves out part of the drawing, and Flutter draws everything.
      SYSTEM_IMAGE: system-images;android-34;default;x86_64
      # The name adb gives the emulator on the port it is started on below.
      DEVICE: emulator-5554
    steps:
    - uses: actions/checkout@v7
    # The tools, Gradle's downloads, the build and the emulator may come to more than the
    # runner has free. These are large, quick to remove and not used here.
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
        df -h /
        nproc
        free -h
    # The same keys as the job above: the two download the same crates and packages.
    - name: Cache the crates
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: wombat-android-${{ runner.os }}-${{ hashFiles('wombat/Cargo.lock') }}
    - name: Cache the Dart packages
      uses: actions/cache@v6
      with:
        path: ~/.pub-cache
        key: wombat-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('wombat/app/pubspec.lock', 'wombat/app/rust_builder/cargokit/build_tool/pubspec.lock') }}
    - name: Install Flutter
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSL --retry 3 -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        echo "${FLUTTER_SHA256}  flutter.tar.xz" | sha256sum -c -
        tar -xJf flutter.tar.xz
        rm flutter.tar.xz
        echo "$PWD/flutter/bin" >> "$GITHUB_PATH"
    # No answer is given to a question, as in the job above. The emulator is the newest
    # one: `sdkmanager` has no way to ask for a version of it.
    - name: Install the NDK, the emulator and the system image
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" emulator platform-tools "$SYSTEM_IMAGE" < /dev/null
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        # Said to both: the tool that makes an emulator and the emulator itself do not
        # look in the same folder where the runner sets `XDG_CONFIG_HOME`.
        mkdir -p "$HOME/.android/avd"
        echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
    # The build compiles the bridge with rustup's `stable` (A131), and would add these by
    # itself; here a download that fails is seen as that. A debug build is made for 32-bit
    # x86 as well, whatever the device (`rust_builder/cargokit/gradle/plugin.gradle`).
    - name: Install the Rust targets of the emulator
      run: rustup target add --toolchain stable x86_64-linux-android i686-linux-android
    - name: Show toolchain
      run: |
        flutter doctor -v
        rustup toolchain list
        emulator -version | head -n 2
        df -h /
    - name: Get packages
      run: flutter pub get --enforce-lockfile
    # Before the emulator starts, so that the two do not take the processors from each
    # other, and so that an app that does not build fails here and not in the first test.
    - name: Build
      run: flutter build apk --debug --target-platform android-x64
    # The runner has KVM, but not for the user the job runs as.
    - name: Let the emulator use KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm
        emulator -accel-check
    # A phone of an ordinary size. No keyboard of the computer's, so that the one on the
    # screen comes up as on a phone, and room for the app and the 100,000-cell document.
    - name: Make the emulator
      run: |
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name wombat --package "$SYSTEM_IMAGE" --device pixel_6
        config="$ANDROID_AVD_HOME/wombat.avd/config.ini"
        sed -i -e '/^hw\.keyboard *=/d' -e '/^disk\.dataPartition\.size *=/d' "$config"
        printf '%s\n' hw.keyboard=no disk.dataPartition.size=4G >> "$config"
        cat "$config"
    # It keeps running after this step, for the steps below. `-accel on`: without KVM it
    # stops at once, where it would otherwise imitate the processor and take an hour.
    # Nothing is kept from one run to the next: a start from nothing takes a minute or
    # two, and an image of a started one would take a gigabyte or more of the cache.
    - name: Start the emulator
      run: |
        nohup emulator -avd wombat -port 5554 -accel on -memory 4096 -cores 2 \
          -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
          -gpu swiftshader_indirect -camera-back none -camera-front none \
          < /dev/null > "$RUNNER_TEMP/emulator.log" 2>&1 &
        started() {
          [ "$(adb -s "$DEVICE" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]
        }
        # Ten minutes at most, and no longer than the emulator lives.
        for _ in $(seq 120); do
          sleep 5
          if started || ! pgrep -f -- '-avd wombat' > /dev/null; then break; fi
        done
        if ! started; then
          tail -n 100 "$RUNNER_TEMP/emulator.log"
          echo "::error::The emulator did not start within ten minutes, or ended. Its last lines are above."
          exit 1
        fi
        # Room for what the tests log, which the last step prints.
        adb -s "$DEVICE" logcat -G 16M
        for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
          adb -s "$DEVICE" shell settings put global "$scale" 0
        done
        adb -s "$DEVICE" shell input keyevent 82
        adb devices -l
        adb -s "$DEVICE" shell getprop ro.build.version.release
        adb -s "$DEVICE" shell wm size
        adb -s "$DEVICE" shell df -h /data
        flutter devices
    # One file at a time, as on Linux, and each with a limit of its own: a test on a device
    # has no time limit, so one that waits for ever would otherwise take the whole job.
    - name: Test the bridge check on the emulator
      run: timeout -k 30 900 flutter test integration_test/app_test.dart -d "$DEVICE"
    - name: Test the grid screen on the emulator
      run: timeout -k 30 900 flutter test integration_test/grid_test.dart -d "$DEVICE"
    # Last, as the one that takes longest: the 100,000-cell document, and what memory the
    # app needs for it, which is the question on Android. The report is in the log of this
    # step. Twice: the first run builds the document, and with the app left on the device
    # the second finds it and only opens it, if Android kept the folder; each report says
    # which it was. This is a debug build on an emulator: its times are not a phone's, nor
    # an optimised build's.
    - name: Measure on the emulator, building the document
      run: timeout -k 30 1200 flutter test integration_test/measure_test.dart -d "$DEVICE" --no-uninstall
    # Where the app keeps what it writes, which on Android nobody had seen. Only to read:
    # it does not fail the job.
    - name: Show the files the app left
      run: |
        for package in $(adb -s "$DEVICE" shell pm list packages -3 | tr -d '\r' | sed 's/^package://'); do
          echo "$package"
          # One argument: the device's shell reads it again, and would otherwise run
          # only the first command as the app.
          adb -s "$DEVICE" shell "run-as $package sh -c 'pwd; find . -name \"*.wombat*\" -exec ls -l {} +'" || true
        done
    - name: Measure on the emulator, opening the document
      run: timeout -k 30 1200 flutter test integration_test/measure_test.dart -d "$DEVICE"
    # What the app and Android logged, for a failure above, and the end of the emulator's
    # own log. Also after a failure, and never one itself.
    - name: Show what the device logged
      if: ${{ !cancelled() }}
      run: |
        echo "::group::The app and warnings of the system"
        adb -s "$DEVICE" logcat -d -v time '*:W' flutter:V | tail -n 600 || true
        echo "::endgroup::"
        echo "::group::The emulator"
        tail -n 60 "$RUNNER_TEMP/emulator.log" || true
        echo "::endgroup::"
        df -h / || true
