[package]
name = "wombat-cli"
description = "The wombat command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wombat"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wombat-core = { path = "../wombat-core" }
wombat-cts = { path = "../wombat-cts" }
wombat-search = { path = "../wombat-search" }
# Operating system randomness, to seed the generator of permanent IDs.
getrandom = "0.3"

[dev-dependencies]
serde_json = "1"
