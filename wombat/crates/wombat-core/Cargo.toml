[package]
name = "wombat-core"
description = "The Wombat core: nested-grid documents with no interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# float_roundtrip: numbers in unknown fields must survive load and save exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1"
